<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results Summary Component</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="result">
        <h2>Your Result</h2>

        <div class="score-circle">
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <h2 class="great">Great</h2>

        <p class="result-text">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </section>

      <section class="summary">
        <h2>Summary</h2>

        <div class="summary-item reaction">
          <div class="category">
            <img src="./assets/images/icon-reaction.svg" alt="" />
            <span>Reaction</span>
          </div>
          <p><strong>80</strong> <span>/ 100</span></p>
        </div>

        <div class="summary-item memory">
          <div class="category">
            <img src="./assets/images/icon-memory.svg" alt="" />
            <span>Memory</span>
          </div>
          <p><strong>92</strong> <span>/ 100</span></p>
        </div>

        <div class="summary-item verbal">
          <div class="category">
            <img src="./assets/images/icon-verbal.svg" alt="" />
            <span>Verbal</span>
          </div>
          <p><strong>61</strong> <span>/ 100</span></p>
        </div>

        <div class="summary-item visual">
          <div class="category">
            <img src="./assets/images/icon-visual.svg" alt="" />
            <span>Visual</span>
          </div>
          <p><strong>72</strong> <span>/ 100</span></p>
        </div>

        <button class="continue-btn">Continue</button>
      </section>
    </main>
  </body>
</html>
